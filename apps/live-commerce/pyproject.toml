[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fal-live-commerce-starter"
version = "0.1.0"
description = "The runnable Live House vertical slice for AI-native live commerce with fal integration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "httpx>=0.28,<1.0",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
fal = ["fal-client"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]
all = [
  "fal-client",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
live-house = "livecommerce.cli:main"
live-commerce = "livecommerce.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
livecommerce = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
